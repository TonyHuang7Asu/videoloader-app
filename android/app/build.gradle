plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vlapp.android'
    compileSdk 35
    defaultConfig {
        applicationId "com.vlapp.android"
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        release {
            storeType 'PKCS12'
            storeFile file('../keystore/vl.p12')
            storePassword 'vl2026'
            keyAlias 'videoloader'
            keyPassword 'vl2026'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
